plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}


// FANTAG auto-versioning for GitHub Actions / F-Droid repo publishing.
// Do not fall back to GITHUB_RUN_NUMBER here. GitHub run numbers can be lower
// than the current published Android versionCode, which makes F-Droid ignore APKs.
// Override with -PFANTAG_VERSION_CODE=93 -PFANTAG_VERSION_NAME=2.0.7-b15 if needed.
def fantagBaseVersion = (findProperty("FANTAG_BASE_VERSION") ?: System.getenv("FANTAG_BASE_VERSION") ?: "2.0.7").toString()
def fantagVersionCodeRaw = (findProperty("FANTAG_VERSION_CODE") ?: System.getenv("FANTAG_VERSION_CODE") ?: "93").toString()
def fantagVersionCode = fantagVersionCodeRaw.replaceAll(/[^0-9]/, "").toInteger()
// Visible app version should follow the Android wrapper version, not the web/docker version.
// Keep versionCode monotonic for Android/F-Droid updates; default local versionName is 2.0.7-b15.
def fantagVersionName = (findProperty("FANTAG_VERSION_NAME") ?: System.getenv("FANTAG_VERSION_NAME") ?: "2.0.7-b15").toString()

// Persistent F-Droid release signing. The keystore is restored from a GitHub
// secret (FDROID_KEYSTORE_B64) in CI and passed in via -P properties so the
// signer stays identical across runners. Without this, F-Droid rejects updates
// with a signer-mismatch error. Falls back to debug signing for local builds.
def fdroidStoreFile = findProperty("FDROID_STORE_FILE") ?: System.getenv("FDROID_STORE_FILE")
def fdroidStorePassword = findProperty("FDROID_STORE_PASSWORD") ?: System.getenv("FDROID_STORE_PASSWORD")
def fdroidKeyAlias = findProperty("FDROID_KEY_ALIAS") ?: System.getenv("FDROID_KEY_ALIAS")
def fdroidKeyPassword = findProperty("FDROID_KEY_PASSWORD") ?: System.getenv("FDROID_KEY_PASSWORD")

android {
    namespace 'com.northstarlabs.fantag'
    compileSdk 35

    signingConfigs {
        fdroidRelease {
            if (fdroidStoreFile) {
                storeFile file(fdroidStoreFile)
                storePassword fdroidStorePassword
                keyAlias fdroidKeyAlias
                keyPassword fdroidKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.northstarlabs.fantag"
        minSdk 26
        targetSdk 35
        versionCode fantagVersionCode
        versionName fantagVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (fdroidStoreFile) {
                signingConfig signingConfigs.fdroidRelease
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
}
