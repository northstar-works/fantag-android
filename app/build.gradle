plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.northstarlabs.fantag'
    compileSdk 35

    defaultConfig {
        applicationId "com.northstarlabs.fantag"
        minSdk 26
        targetSdk 35
        versionCode 65
        versionName "3.2.9-b65-fdroid1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Firebase Cloud Messaging for Android push notifications.
    // This compiles without google-services.json; runtime registration is skipped gracefully
    // until a Firebase config is added to app/google-services.json.
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging-ktx'
}


// Apply Firebase config generation only when the private config file exists.
// This keeps open/dev builds from failing while still enabling real FCM builds.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
