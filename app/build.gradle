plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// FANTAG Android wrapper versioning.
// GitHub Actions can override these with -PFANTAG_VERSION_CODE / -PFANTAG_VERSION_NAME.
def fantagBaseVersion = (findProperty("FANTAG_BASE_VERSION") ?: System.getenv("FANTAG_BASE_VERSION") ?: "3.3.0").toString()
def fantagVersionCodeRaw = (findProperty("FANTAG_VERSION_CODE") ?: System.getenv("FANTAG_VERSION_CODE") ?: "85").toString()
def fantagVersionCode = fantagVersionCodeRaw.replaceAll(/[^0-9]/, "").toInteger()
def fantagVersionName = (findProperty("FANTAG_VERSION_NAME") ?: System.getenv("FANTAG_VERSION_NAME") ?: "${fantagBaseVersion}-b${fantagVersionCode}").toString()

def hasReleaseSigning = System.getenv("FANTAG_KEYSTORE_FILE") &&
        System.getenv("FANTAG_KEYSTORE_PASSWORD") &&
        System.getenv("FANTAG_KEY_ALIAS") &&
        System.getenv("FANTAG_KEY_PASSWORD")

android {
    namespace 'com.northstarlabs.fantag'
    compileSdk 35

    defaultConfig {
        applicationId "com.northstarlabs.fantag"
        minSdk 26
        targetSdk 35
        versionCode fantagVersionCode
        versionName fantagVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(System.getenv("FANTAG_KEYSTORE_FILE"))
                storePassword System.getenv("FANTAG_KEYSTORE_PASSWORD")
                keyAlias System.getenv("FANTAG_KEY_ALIAS")
                keyPassword System.getenv("FANTAG_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
}
