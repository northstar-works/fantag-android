plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}


// FANTAG auto-versioning for GitHub Actions / F-Droid repo publishing.
// Override with -PFANTAG_VERSION_CODE=93 -PFANTAG_VERSION_NAME=2.0.7-b15 if needed.
def fantagBaseVersion = (findProperty("FANTAG_BASE_VERSION") ?: System.getenv("FANTAG_BASE_VERSION") ?: "2.0.7").toString()
def fantagVersionCodeRaw = (findProperty("FANTAG_VERSION_CODE") ?: System.getenv("FANTAG_VERSION_CODE") ?: System.getenv("GITHUB_RUN_NUMBER") ?: "93").toString()
def fantagVersionCode = fantagVersionCodeRaw.replaceAll(/[^0-9]/, "").toInteger()
// Visible app version should follow the Android wrapper version, not the web/docker version.
// Keep versionCode monotonic for Android/F-Droid updates; default local versionName is 2.0.7-b15.
def fantagVersionName = (findProperty("FANTAG_VERSION_NAME") ?: System.getenv("FANTAG_VERSION_NAME") ?: "2.0.7-b15").toString()

android {
    namespace 'com.northstarlabs.fantag'
    compileSdk 35

    defaultConfig {
        applicationId "com.northstarlabs.fantag"
        minSdk 26
        targetSdk 35
        versionCode fantagVersionCode
        versionName fantagVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
}
