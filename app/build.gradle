plugins {
    id 'com.android.application'
}

android {
    namespace 'com.northstarlabs.fantag'
    compileSdk 35

    defaultConfig {
        applicationId 'com.northstarlabs.fantag'
        minSdk 26
        targetSdk 35
        versionCode 64
        versionName '3.2.8-b64'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // Android Studio will create/use your real release signing config.
        // Do not commit private keystore files to git.
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
}
