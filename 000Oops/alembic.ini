# Alembic configuration
# Run: alembic init migrations   (first time only)
# Then: alembic revision --autogenerate -m "init"
# Then: alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Read DATABASE_URL from .env — override with env var in Docker
sqlalchemy.url = sqlite:///./fantag.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
