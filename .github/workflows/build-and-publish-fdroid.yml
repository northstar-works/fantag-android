name: Build Fantag APK and Publish to F-Droid Repo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fantag-android
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Restore persistent release keystore
        id: keystore
        env:
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
        run: |
          set -e
          if [ -z "$FDROID_KEYSTORE_B64" ]; then
            echo "ERROR: FDROID_KEYSTORE_B64 secret is missing. F-Droid needs a persistent signer."
            exit 1
          fi
          echo "$FDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fdroid-release.keystore"
          echo "store_file=$RUNNER_TEMP/fdroid-release.keystore" >> "$GITHUB_OUTPUT"

      - name: Checkout fdroid repo
        run: |
          git clone https://x-access-token:${{ secrets.FDROID_REPO_PAT }}@github.com/northstar-works/fdroid.git fdroid-repo

      - name: Compute Android version
        id: version
        run: |
          set -e
          PKG="com.northstarlabs.fantag"
          BASE_VERSION="2.0"

          # Fully automatic versioning. Scan the APKs already published in the
          # fdroid repo for this package and take the highest versionCode, then
          # add 1. This guarantees a monotonically increasing versionCode without
          # any manual bumping. versionName is derived as ${BASE_VERSION}.<code>.
          HIGHEST=0
          if [ -d fdroid-repo/repo ]; then
            for f in fdroid-repo/repo/${PKG}_*.apk; do
              [ -e "$f" ] || continue
              CODE="$(basename "$f" | sed -n "s/^${PKG}_\([0-9][0-9]*\)\.apk$/\1/p")"
              if [ -n "$CODE" ] && [ "$CODE" -gt "$HIGHEST" ]; then
                HIGHEST="$CODE"
              fi
            done
          fi

          VERSION_CODE=$((HIGHEST + 1))
          VERSION_NAME="${BASE_VERSION}.${VERSION_CODE}"

          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Highest published versionCode: $HIGHEST"
          echo "Building Fantag Android $VERSION_NAME ($VERSION_CODE)"

      - name: Build signed release APK
        env:
          FDROID_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
          FDROID_STORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon clean assembleRelease \
            -PFANTAG_BASE_VERSION="${{ steps.version.outputs.base_version }}" \
            -PFANTAG_VERSION_CODE="${{ steps.version.outputs.version_code }}" \
            -PFANTAG_VERSION_NAME="${{ steps.version.outputs.version_name }}" \
            -PFDROID_STORE_FILE="$FDROID_STORE_FILE" \
            -PFDROID_STORE_PASSWORD="$FDROID_STORE_PASSWORD" \
            -PFDROID_KEY_ALIAS="$FDROID_KEY_ALIAS" \
            -PFDROID_KEY_PASSWORD="$FDROID_KEY_PASSWORD"

      - name: Locate and verify APK
        id: apk
        run: |
          set -e

          APK="$(find app/build/outputs/apk/release -type f -name "*.apk" | grep -v androidTest | grep -v unsigned | head -n 1)"
          if [ -z "$APK" ]; then
            APK="$(find app/build/outputs/apk -type f -name "*.apk" | grep -v androidTest | grep -v unsigned | head -n 1)"
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK found."
            exit 1
          fi

          SIZE="$(stat -c%s "$APK")"
          echo "APK=$APK"
          echo "SIZE=$SIZE"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: APK is too small. Refusing to publish bad APK."
            ls -lh "$APK"
            exit 1
          fi

          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)"
          BADGING="$($AAPT dump badging "$APK")"

          PACKAGE="$(echo "$BADGING" | sed -n "s/package: name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"

          if [ -z "$PACKAGE" ] || [ -z "$VERSION_CODE" ]; then
            echo "ERROR: Could not read APK package/version."
            echo "$BADGING"
            exit 1
          fi

          # Verify the APK is actually signed. An unsigned/debug APK breaks F-Droid updates.
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          if ! "$APKSIGNER" verify --print-certs "$APK" >/dev/null 2>&1; then
            echo "ERROR: APK failed signature verification."
            exit 1
          fi

          OUT_NAME="${PACKAGE}_${VERSION_CODE}.apk"

          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "out_name=$OUT_NAME" >> "$GITHUB_OUTPUT"

          echo "Detected package: $PACKAGE"
          echo "Detected versionCode: $VERSION_CODE"
          echo "Detected versionName: $VERSION_NAME"
          echo "Output APK name: $OUT_NAME"

      - name: Upload APK artifact for backup only
        uses: actions/upload-artifact@v4
        with:
          name: fantag-apk-${{ steps.apk.outputs.version_code }}
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Install F-Droid server tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y fdroidserver

      - name: Copy APK and update F-Droid metadata
        run: |
          set -e

          mkdir -p fdroid-repo/repo fdroid-repo/metadata
          cp "${{ steps.apk.outputs.apk_path }}" "fdroid-repo/repo/${{ steps.apk.outputs.out_name }}"

          cat > fdroid-repo/metadata/com.northstarlabs.fantag.yml <<EOF
          Categories:
            - Sports & Health

          License: proprietary

          AuthorName: Northstar Labs
          AuthorWebSite: https://github.com/northstar-works

          Name: FANTAG
          Summary: Fantasy baseball roster tracker for your self-hosted FANTAG server
          Description: |-
            FANTAG is a personal fantasy baseball roster management tool that connects
            to your self-hosted FANTAG server.

            This private Android build is a native WebView wrapper for your FANTAG web UI.
            Default server URL: https://fantag.sidneyshelton.com/
            Web/Docker target version: 3.5.0-b87

          RepoType: git
          Repo: https://github.com/northstar-works/fantag-android

          AutoUpdateMode: None
          UpdateCheckMode: None

          CurrentVersion: ${{ steps.apk.outputs.version_name }}
          CurrentVersionCode: ${{ steps.apk.outputs.version_code }}
          EOF

          echo "Copied APK:"
          ls -lh "fdroid-repo/repo/${{ steps.apk.outputs.out_name }}"
          echo "Updated metadata:"
          cat fdroid-repo/metadata/com.northstarlabs.fantag.yml

      - name: Regenerate F-Droid index
        run: |
          set -e
          cd fdroid-repo
          # config.yml + signing keystore live in the fdroid repo; fdroid update
          # rebuilds the signed index so the F-Droid app sees the new versionCode.
          fdroid update --create-metadata --pretty || fdroid update --pretty

      - name: Commit APK and index to fdroid repo
        run: |
          set -e

          cd fdroid-repo

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add repo metadata

          if git diff --cached --quiet; then
            echo "No fdroid repo changes to commit."
            exit 0
          fi

          git commit -m "Add Fantag Android ${{ steps.apk.outputs.version_name }} APK ${{ steps.apk.outputs.version_code }}"
          git push
