name: Build Fantag APK and Publish to F-Droid Repo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fantag-android
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: Locate and verify APK
        id: apk
        run: |
          set -e

          APK="$(find app/build/outputs/apk -type f -name "*.apk" | grep -v androidTest | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK found."
            exit 1
          fi

          SIZE="$(stat -c%s "$APK")"
          echo "APK=$APK"
          echo "SIZE=$SIZE"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: APK is too small. Refusing to publish bad APK."
            ls -lh "$APK"
            exit 1
          fi

          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)"
          BADGING="$($AAPT dump badging "$APK")"

          PACKAGE="$(echo "$BADGING" | sed -n "s/package: name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"

          if [ -z "$PACKAGE" ] || [ -z "$VERSION_CODE" ]; then
            echo "ERROR: Could not read APK package/version."
            echo "$BADGING"
            exit 1
          fi

          OUT_NAME="${PACKAGE}_${VERSION_CODE}.apk"

          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "out_name=$OUT_NAME" >> "$GITHUB_OUTPUT"

          echo "Detected package: $PACKAGE"
          echo "Detected versionCode: $VERSION_CODE"
          echo "Detected versionName: $VERSION_NAME"
          echo "Output APK name: $OUT_NAME"

      - name: Upload APK artifact for backup only
        uses: actions/upload-artifact@v4
        with:
          name: fantag-apk-${{ steps.apk.outputs.version_code }}
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Checkout fdroid repo
        run: |
          git clone https://x-access-token:${{ secrets.FDROID_REPO_PAT }}@github.com/northstar-works/fdroid.git fdroid-repo

      - name: Copy APK into fdroid repo
        run: |
          set -e

          mkdir -p fdroid-repo/repo
          cp "${{ steps.apk.outputs.apk_path }}" "fdroid-repo/repo/${{ steps.apk.outputs.out_name }}"

          echo "Copied APK:"
          ls -lh "fdroid-repo/repo/${{ steps.apk.outputs.out_name }}"

      - name: Commit APK to fdroid repo
        run: |
          set -e

          cd fdroid-repo

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add repo/${{ steps.apk.outputs.out_name }}

          if git diff --cached --quiet; then
            echo "No fdroid repo changes to commit."
            exit 0
          fi

          git commit -m "Add Fantag Android ${{ steps.apk.outputs.version_name }} APK ${{ steps.apk.outputs.version_code }}"
          git push